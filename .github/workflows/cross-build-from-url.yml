name: Cross-build from URL (aarch64/ARM64, glibc)

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: '源码下载地址（.tar.gz / .tar.xz / .tar.bz2）'
        required: true
      build_command:
        description: '交叉编译命令（工作目录=解压后的源码根；$PKGROOT 指向打包根，把产物拷进去即可）'
        required: true
        default: 'make CC=aarch64-linux-gnu-gcc -j$(nproc) && mkdir -p $PKGROOT/usr/bin && cp $(ls | grep -vE "Makefile|README|\.c$|\.h$" | head -1) $PKGROOT/usr/bin/ 2>/dev/null || true'
      artifact_prefix:
        description: '产物命名前缀（防撞名，自动加 run#）'
        required: false
        default: 'out'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装 aarch64 交叉工具链
        run: |
          sudo dpkg --add-architecture arm64
          # 默认源仅 amd64（避免 arm64 索引 404），arm64 走 ubuntu-ports；只改 sources.list、跳过已有 [arch=] 行（第三方 .list.d 不动）
          sudo sed -i '/\[arch=/!s/^deb /deb [arch=amd64] /' /etc/apt/sources.list 2>/dev/null || true
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main universe multiverse restricted" | sudo tee /etc/apt/sources.list.d/arm64-ports.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            pkg-config make bc ca-certificates curl xz-utils file

      - name: 下载并解压源码
        run: |
          URL="${{ github.event.inputs.source_url }}"
          echo "下载: $URL"
          mkdir -p work && cd work
          curl -fL "$URL" -o src.tar || { echo "下载失败"; exit 1; }
          ls -la src.tar
          case "$URL" in
            *.tar.gz|*.tgz)        tar xzf src.tar ;;
            *.tar.xz)              tar xJf src.tar ;;
            *.tar.bz2|*.tbz2)      tar xjf src.tar ;;
            *.tar)                 tar xf src.tar ;;
            *) echo "未知压缩格式（需 .tar.gz/.tar.xz/.tar.bz2）"; exit 1 ;;
          esac
          SRC=$(ls -d */ | head -1 | tr -d '/')
          echo "源码目录: $SRC"
          echo "SRC_DIR=work/$SRC" >> "$GITHUB_ENV"

      - name: 交叉编译
        working-directory: ${{ env.SRC_DIR }}
        env:
          CC: aarch64-linux-gnu-gcc
          PKG_CONFIG_PATH: /usr/lib/aarch64-linux-gnu/pkgconfig
          PKG_CONFIG_SYSROOT_DIR: /
          PKGROOT: ${{ github.workspace }}/pkgroot
        run: |
          mkdir -p "$PKGROOT"
          ${{ github.event.inputs.build_command }}

      - name: 打包产物（无顶层目录前缀）
        run: |
          ART="${{ github.event.inputs.artifact_prefix }}-${{ github.run_number }}.tar.gz"
          tar czf "$ART" -C pkgroot .
          echo "产物: $ART"
          tar tzf "$ART"
          echo "ARTIFACT=$ART" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ env.ARTIFACT }}
